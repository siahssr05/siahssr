<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>SIAHSSR — Sai Institute of Arts, Humanities and Social Science Research</title>
  <meta name="description" content="Sai Institute of Arts, Humanities and Social Science Research — academic journals, submissions, and peer review." />
  <link rel="alternate" type="application/rss+xml" title="SIAHSSR — Recently Published" href="/feed.xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/css/theme.css" rel="stylesheet" />

  <style>
    /* Full-width stats strip */
    #stats-section {
      background: #f8f6f2;
      padding: 40px 0;
    }
    #stats-section .row {
      margin: 0;
    }
    #stats-section .col {
      flex: 1;
      border-right: 1px solid #ddd;
    }
    #stats-section .col:last-child {
      border-right: none;
    }
    #stats-section h2 {
      font-size: 32px;
      margin-bottom: 5px;
    }
    @media (max-width: 768px) {
      #stats-section .col {
        flex: 0 0 50%;
        border-right: none;
        border-bottom: 1px solid #ddd;
        padding: 15px 0;
      }
    }
  </style>
</head>
<body data-page="home">
  <div id="app-navbar"></div>

  <main>
    <section class="hero-section py-5">
      <div class="container py-4 text-center">
        <h1 class="fw-bold display-6 mb-3" id="hero-title">Sai Institute of Arts, Humanities and Social Science Research</h1>
        <p class="lead" id="hero-subtitle"></p>
          <div class="d-flex flex-column flex-sm-row justify-content-center gap-3 mt-4">
          <a href="/journals.html" class="btn btn-light btn-lg text-navy fw-semibold">Explore Journals</a>
          <a href="/submit-paper.html" class="btn btn-outline-light btn-lg">Submit a Paper</a>
        </div>
      </div>
    </section>

    

    <div class="container py-4 mb-4">
      <div class="row g-4">
        <div class="col-lg-8">
          <section id="latest-section" style="display:none;" class="mb-5">
            <h3 class="brand-font mb-4">Recently Published</h3>
            <div class="row g-4" id="latest-papers"></div>
          </section>

          <section id="announcements-section" style="display:none;">
            <h3 class="brand-font mb-4">Announcements</h3>
            <div id="announcements-list"></div>
          </section>
        </div>

        <div class="col-lg-4">
          <aside class="notice-board sticky-lg-top" id="notice-board" style="display:none;">
            <h3 class="brand-font mb-3"><i class="bi bi-megaphone-fill text-gold me-2"></i>Notice Board</h3>
            <div id="notice-list"></div>
          </aside>
        </div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/partials.js"></script>
  <script src="/js/pages/home.js"></script>
</body>
</html>
