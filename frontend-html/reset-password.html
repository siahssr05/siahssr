<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>Reset Password — SIAHSSR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/css/theme.css" rel="stylesheet" />
</head>
<body data-page="reset-password">
  <div class="auth-shell">
    <div class="auth-shell-brand">
      <a href="/" class="auth-brand-logo">
        <img src="/logo-site.png" alt="SIAHSSR" />
        <span>SIAHSSR</span>
      </a>
      <div class="auth-brand-copy">
        <h2>Choose a new password.</h2>
        <p>Pick something strong and memorable — at least 6 characters.</p>
        <ul>
          <li><i class="bi bi-shield-lock"></i>Your account, secured</li>
          <li><i class="bi bi-box-arrow-in-right"></i>You'll be signed in right after</li>
        </ul>
      </div>
      <div class="auth-brand-foot">&copy; <span id="auth-year"></span> SIAHSSR. All rights reserved.</div>
    </div>

    <div class="auth-shell-form">
      <div class="auth-mobile-brand">
        <img src="/logo-site.png" alt="SIAHSSR" />
        <span>SIAHSSR</span>
      </div>
      <div class="auth-card">
        <p class="auth-card-eyebrow">Account recovery</p>
        <h1 class="brand-font">Reset your password</h1>
        <p class="auth-subtitle">Enter a new password for your account.</p>
        <div id="reset-error" class="alert alert-danger" style="display:none;"></div>
        <p id="reset-message" class="text-center" style="display:none;"></p>
        <form id="reset-form">
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <div class="auth-input-group">
              <i class="bi bi-lock"></i>
              <input type="password" class="form-control" name="newPassword" placeholder="At least 6 characters" required minlength="6" />
            </div>
          </div>
          <button class="btn btn-navy w-100" type="submit">Reset Password</button>
        </form>
        <p class="text-center small mt-3 mb-0"><a href="/login-admin.html"><i class="bi bi-arrow-left"></i> Back to login</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/partials.js"></script>
  <script src="/js/pages/reset-password.js"></script>
  <script>document.getElementById("auth-year").textContent = new Date().getFullYear();</script>
</body>
</html>
