<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>Submit a Paper — SIAHSSR</title>
  <meta name="description" content="Submit your paper to SIAHSSR — no account needed, just fill in your details and upload your article." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/css/theme.css" rel="stylesheet" />
</head>
<body data-page="submit-paper">
  <div id="app-navbar"></div>

  <main class="container py-5" style="max-width:720px;">
    <div id="submit-result" style="display:none;" class="text-center py-5">
      <i class="bi bi-check-circle-fill text-success" style="font-size:3.5rem;"></i>
      <h2 class="brand-font mt-3 mb-3">Submission Received</h2>
      <p id="submit-result-message" class="text-muted"></p>
      <a href="/" class="btn btn-navy mt-2">Back to Home</a>
    </div>

    <div id="submit-form-wrap">
      <h1 class="brand-font mb-2">Submit a Paper</h1>
      <p class="text-muted mb-4">No account needed — just fill in your details and upload your article below. We'll email you once we've reviewed it.</p>
      <div id="submit-error" class="alert alert-danger" style="display:none;"></div>

      <div class="card-siahssr p-4">
        <h5 class="brand-font mb-3">Your details &amp; article</h5>
        <form id="submit-form">
          <div class="mb-3">
            <label class="form-label">Author's Name</label>
            <input class="form-control" name="author_name" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Designation</label>
            <input class="form-control" name="designation" placeholder="e.g. Assistant Professor" />
          </div>
          <div class="mb-3">
            <label class="form-label">Institute Name &amp; Address</label>
            <textarea class="form-control" name="institute_address" rows="2" required></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Email id</label>
            <input type="email" class="form-control" name="email" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Journal</label>
            <select class="form-select" name="journal_id" id="journal-select" required>
              <option value="">Select a journal…</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Title of the Paper</label>
            <input class="form-control" name="title" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Contact No</label>
            <input class="form-control" name="contact_no" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Article (Word .docx only, max 15MB)</label>
            <input type="file" accept=".docx" class="form-control" id="paper-file-input" required />
          </div>
          <div id="captcha-slot"></div>
          <button class="btn btn-navy w-100" id="submit-btn" type="submit">Submit Paper</button>
        </form>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/partials.js"></script>
  <script src="/js/captcha.js"></script>
  <script src="/js/pages/submit-paper.js"></script>
</body>
</html>
