<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>Contact Us — SIAHSSR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/css/theme.css" rel="stylesheet" />
</head>
<body data-page="contact">
  <div id="app-navbar"></div>

  <main class="container py-5" style="max-width:900px;">
    <h1 class="brand-font mb-4">Contact Us</h1>
    <div class="row g-4">
      <div class="col-md-5">
        <div class="card-siahssr p-4 h-100">
          <p><i class="bi bi-telephone me-2 text-gold"></i><span id="contact-phone1"></span></p>
          <p><i class="bi bi-telephone me-2 text-gold"></i><span id="contact-phone2"></span></p>
          <p><i class="bi bi-envelope me-2 text-gold"></i><span id="contact-email"></span></p>
          <p><i class="bi bi-globe me-2 text-gold"></i><a id="contact-website" href="#" target="_blank" rel="noreferrer"></a></p>
          <p class="mb-0"><i class="bi bi-geo-alt me-2 text-gold"></i><span id="contact-address"></span></p>
        </div>
      </div>

      <div class="col-md-7">
        <div class="card-siahssr p-4">
          <h5 class="fw-bold mb-3">Send Us a Message</h5>
          <div id="contact-sent" style="display:none;">
            <p class="mb-0">Thanks for reaching out — we'll get back to you soon.</p>
          </div>
          <form id="contact-form">
            <div id="contact-error" class="alert alert-danger" style="display:none;"></div>
            <div class="row g-2">
              <div class="col-md-6 mb-3">
                <label class="form-label">Name</label>
                <input class="form-control" name="name" required />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" required />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Subject</label>
              <input class="form-control" name="subject" />
            </div>
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" name="message" rows="4" required></textarea>
            </div>
            <div id="captcha-slot"></div>
            <button class="btn btn-navy" id="contact-submit" type="submit">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/partials.js"></script>
  <script src="/js/captcha.js"></script>
  <script src="/js/pages/contact.js"></script>
</body>
</html>
